# Mailpit: the "outside world" for the lab. Postfix relays every message it
# accepts here, so passed mail and DLP notices show up in its web UI.
#   Web UI: http://192.168.0.200:30825
# Messages are kept in memory only; they are gone when the pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.31.4
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: 1025
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-ui
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: http
      nodePort: 30825
