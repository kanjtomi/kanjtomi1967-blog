# Second interface (net1) for the strongSwan pod: macvlan on the host's LAN NIC
# with a fixed address, so the VPN endpoint sits on 192.168.0.0/24 next to the
# Cisco. No NAT in the path (IKE stays on UDP 500, no NAT-T) and no firewalld
# change. Requires Multus (bgp-lab/k8s/multus).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ipsec-lan
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp3s0",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [ { "address": "192.168.0.211/24" } ]
      }
    }
