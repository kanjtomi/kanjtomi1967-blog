# strongSwan side of the IPsec lab: IKEv1 (main mode) route-based VPN to the Cisco C841M.
# Route-based = traffic selectors are any<->any; what goes into the tunnel is
# decided by routes pointing at the XFRM interface ipsec0 (if_id 42), the same
# model as the Cisco's "tunnel mode ipsec ipv4" Tunnel10.
connections {
  cisco {
    # IKEv1 at the user's request. Main mode (aggressive = no, the default):
    # 6 messages for phase 1 (ISAKMP SA), then 3 quick-mode messages for phase 2.
    version = 1
    local_addrs = 192.168.0.211
    remote_addrs = 192.168.0.100
    proposals = aes256-sha256-modp2048
    dpd_delay = 10s
    if_id_in = 42
    if_id_out = 42

    local {
      auth = psk
      id = 192.168.0.211
    }
    remote {
      auth = psk
      id = 192.168.0.100
    }

    children {
      vti {
        local_ts = 0.0.0.0/0
        remote_ts = 0.0.0.0/0
        mode = tunnel
        esp_proposals = aes256-sha256-modp2048
        start_action = start
        dpd_action = restart
        close_action = start
      }
    }
  }
}

# The pre-shared key is not in the repo: it comes from the Secret "ipsec-psk"
# (created by hand, see README), mounted at /etc/swanctl/secrets/.
include secrets/*.conf
