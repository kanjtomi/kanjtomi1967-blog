# DVWA (Damn Vulnerable Web Application) — a deliberately vulnerable
# PHP/MariaDB web app (Apache + MariaDB + PHP all bundled in this one
# image) used to practice web app security testing (SQLi, XSS, CSRF,
# command injection, etc.). Upstream: https://github.com/digininja/DVWA,
# image: docker.io/vulnerables/web-dvwa.
#
# NEVER expose this outside the cluster — it is intentionally full of
# unpatched vulnerabilities by design. service.yaml is ClusterIP-only on
# purpose; access it via `kubectl port-forward` only. See README.md.
# KNOWN ISSUE (unresolved): this container OOMKills (exit 137) within
# seconds of starting mysqld, even at a 4Gi memory limit, on a host with
# 93GB RAM free. Tried 512Mi, 2Gi, and 4Gi — all failed the same way.
# vulnerables/web-dvwa is an old Ubuntu-based image that most likely
# doesn't respect cgroup memory limits when MariaDB auto-sizes its InnoDB
# buffer pool, and ends up trying to size itself against the *host's*
# visible total memory rather than the container's limit. Next step to
# try: exec into a one-off container (no k8s limit) to confirm this
# theory via `mysqld --verbose --help | grep buffer-pool-size`, then
# override it explicitly (small, e.g. 128M) via a my.cnf mounted in
# through a ConfigMap, or via /var/lib/mysql init script if the image
# supports env-based overrides. Left at replicas: 0 so applying this
# doesn't just start a crash loop — scale to 1 once actually debugging it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: security-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
    spec:
      containers:
        - name: dvwa
          image: localhost/dvwa:local
          imagePullPolicy: Never   # image is loaded directly into containerd, no registry
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /login.php
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10   # the bundled MariaDB + Apache both need to start first
          livenessProbe:
            httpGet:
              path: /login.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
