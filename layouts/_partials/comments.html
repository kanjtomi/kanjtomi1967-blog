<section id="comments" style="margin-top: 3rem;">
  <h2>{{ i18n "comments_heading" }}</h2>

  <div id="comments-list">{{ i18n "comments_loading" }}</div>

  <form id="comment-form" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 0.75rem; max-width: 480px;">
    <input type="text" id="comment-author" placeholder="{{ i18n "comments_name_placeholder" }}" maxlength="80" required>
    <textarea id="comment-body" placeholder="{{ i18n "comments_body_placeholder" }}" maxlength="3000" rows="4" required></textarea>

    <div class="cf-turnstile" data-sitekey="{{ .Site.Params.turnstileSiteKey }}"></div>

    <button type="submit">{{ i18n "comments_submit" }}</button>
    <p id="comment-status" style="font-size: 0.85rem;"></p>
  </form>
</section>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(function () {
  var apiBase = "{{ .Site.Params.commentsApiBase }}";
  var slug = "{{ .File.TranslationBaseName }}";
  var locale = "{{ .Site.Language.Lang }}" === "ja" ? "ja-JP" : "en-US";
  var i18nNone = "{{ i18n "comments_none" }}";
  var i18nSending = "{{ i18n "comments_sending" }}";
  var i18nSent = "{{ i18n "comments_sent" }}";
  var i18nSubmitError = "{{ i18n "comments_submit_error" }}";
  var i18nLoadError = "{{ i18n "comments_load_error" }}";
  var listEl = document.getElementById("comments-list");
  var form = document.getElementById("comment-form");
  var statusEl = document.getElementById("comment-status");

  function renderComments(comments) {
    if (!comments.length) {
      listEl.textContent = i18nNone;
      return;
    }
    listEl.innerHTML = "";
    comments.forEach(function (c) {
      var div = document.createElement("div");
      div.style.marginBottom = "1rem";
      var author = document.createElement("strong");
      author.textContent = c.author;
      var date = document.createElement("span");
      date.style.marginLeft = "0.5rem";
      date.style.fontSize = "0.8rem";
      date.style.color = "#888";
      date.textContent = new Date(c.createdAt).toLocaleString(locale);
      var body = document.createElement("p");
      body.textContent = c.body;
      div.appendChild(author);
      div.appendChild(date);
      div.appendChild(body);
      listEl.appendChild(div);
    });
  }

  fetch(apiBase + "/comments?slug=" + encodeURIComponent(slug))
    .then(function (res) { return res.json(); })
    .then(renderComments)
    .catch(function () { listEl.textContent = i18nLoadError; });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var token = document.querySelector('input[name="cf-turnstile-response"]');
    var payload = {
      slug: slug,
      author: document.getElementById("comment-author").value,
      body: document.getElementById("comment-body").value,
      turnstileToken: token ? token.value : ""
    };

    statusEl.textContent = i18nSending;

    fetch(apiBase + "/comments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("submit failed");
        return res.json();
      })
      .then(function () {
        statusEl.textContent = i18nSent;
        form.reset();
        if (window.turnstile) window.turnstile.reset();
      })
      .catch(function () {
        statusEl.textContent = i18nSubmitError;
      });
  });
})();
</script>
