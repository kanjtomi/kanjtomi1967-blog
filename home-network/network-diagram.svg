<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <style>
    .box{fill:#ffffff;stroke:#334155;stroke-width:1.5}
    .cisco{fill:#eef6fb;stroke:#0e7490;stroke-width:1.8}
    .pi{fill:#fdf2f4;stroke:#be185d;stroke-width:1.5}
    .srv{fill:#f1f5f9;stroke:#334155;stroke-width:1.5}
    .pod{fill:#ffffff;stroke:#64748b;stroke-width:1;stroke-dasharray:3 2}
    .t{font-size:13px;fill:#0f172a}
    .h{font-size:14px;font-weight:600;fill:#0f172a}
    .s{font-size:11.5px;fill:#334155}
    .m{font-size:11px;fill:#64748b}
    .phy{stroke:#334155;stroke-width:2;fill:none}
    .trunk{stroke:#0e7490;stroke-width:3.5;fill:none}
    .log{stroke:#b45309;stroke-width:1.8;stroke-dasharray:6 4;fill:none}
    .down{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:3 4;fill:none}
    .lt{font-size:11px;fill:#b45309}
  </style>
  <rect width="1000" height="800" fill="#ffffff"/>

  <text x="40" y="34" class="h" font-size="18">Home network</text>
  <text x="40" y="54" class="m">as of 2026-11-14 · values read from the devices</text>

  <!-- Internet + home router -->
  <ellipse cx="500" cy="45" rx="90" ry="28" class="box"/>
  <text x="500" y="50" class="h" text-anchor="middle">Internet</text>
  <line x1="500" y1="73" x2="500" y2="100" class="phy"/>
  <rect x="400" y="100" width="200" height="50" rx="6" class="box"/>
  <text x="500" y="121" class="h" text-anchor="middle">Home router</text>
  <text x="500" y="139" class="s" text-anchor="middle">192.168.0.1</text>
  <line x1="500" y1="150" x2="500" y2="190" class="phy"/>

  <!-- Home LAN bus -->
  <line x1="40" y1="190" x2="960" y2="190" stroke="#334155" stroke-width="4"/>
  <text x="40" y="182" class="t" font-weight="600">Home LAN 192.168.0.0/24</text>

  <!-- PC -->
  <line x1="125" y1="190" x2="125" y2="230" class="phy"/>
  <rect x="40" y="230" width="170" height="64" rx="6" class="box"/>
  <text x="125" y="254" class="h" text-anchor="middle">Windows PC</text>
  <text x="125" y="272" class="s" text-anchor="middle">192.168.0.22 (Jenkins)</text>
  <text x="125" y="287" class="m" text-anchor="middle">Tera Term → Kobe console (COM3)</text>

  <!-- Raspberry Pi on home LAN -->
  <line x1="305" y1="190" x2="305" y2="230" class="phy"/>
  <rect x="230" y="230" width="150" height="64" rx="6" class="pi"/>
  <text x="305" y="254" class="h" text-anchor="middle">Raspberry Pi 4?</text>
  <text x="305" y="272" class="s" text-anchor="middle">192.168.0.4</text>
  <text x="305" y="287" class="m" text-anchor="middle">ARP only, no open ports</text>

  <!-- RHEL host -->
  <line x1="500" y1="190" x2="500" y2="230" class="phy"/>
  <rect x="400" y="230" width="200" height="150" rx="6" class="srv"/>
  <text x="500" y="252" class="h" text-anchor="middle">RHEL k8s host</text>
  <text x="500" y="269" class="s" text-anchor="middle">192.168.0.200 (enp3s0)</text>
  <rect x="412" y="282" width="176" height="42" rx="4" class="pod"/>
  <text x="500" y="299" class="s" text-anchor="middle">FRR pod · 192.168.0.210</text>
  <text x="500" y="315" class="m" text-anchor="middle">AS65002 (Multus macvlan)</text>
  <rect x="412" y="330" width="176" height="42" rx="4" class="pod"/>
  <text x="500" y="347" class="s" text-anchor="middle">strongSwan pod · 192.168.0.211</text>
  <text x="500" y="363" class="m" text-anchor="middle">172.16.12.0/24 (ipsec0)</text>

  <!-- Cisco Kobe -->
  <line x1="830" y1="190" x2="830" y2="230" class="phy"/>
  <text x="836" y="215" class="m">Gi0/4</text>
  <rect x="700" y="230" width="260" height="200" rx="6" class="cisco"/>
  <text x="830" y="252" class="h" text-anchor="middle">Cisco C841M "Kobe"</text>
  <text x="714" y="274" class="s">Gi0/4  192.168.0.100 · AS65001</text>
  <text x="714" y="292" class="s">Vlan1  10.10.10.1/24 (DHCP .1–.126)</text>
  <text x="714" y="310" class="s">Vlan10 10.10.11.1/24</text>
  <text x="714" y="328" class="s">Lo1 172.16.1.1 · Lo2 172.16.11.1</text>
  <text x="714" y="346" class="s">Tunnel10 169.254.200.1 (IPsec)</text>
  <text x="714" y="364" class="s">Tunnel1 169.254.97.146 → AWS (down)</text>
  <text x="714" y="382" class="s">Gi0/5 10.10.20.2/24 (down)</text>
  <text x="714" y="400" class="m">default → 192.168.0.1</text>
  <text x="714" y="416" class="m">172.16.0.0/16 → 10.10.20.1</text>

  <!-- Logical links Kobe <-> RHEL pods -->
  <line x1="700" y1="303" x2="588" y2="303" class="log"/>
  <text x="644" y="296" class="lt" text-anchor="middle">eBGP</text>
  <line x1="700" y1="351" x2="588" y2="351" class="log"/>
  <text x="644" y="344" class="lt" text-anchor="middle">IPsec IKEv1</text>

  <!-- AWS tunnel -->
  <path d="M 960 255 C 995 130, 760 40, 590 45" class="down"/>
  <text x="615" y="170" class="m">Tunnel1 → AWS Site-to-Site VPN (down)</text>

  <!-- Pi 3B+ on Gi0/0 -->
  <line x1="745" y1="430" x2="685" y2="520" class="phy"/>
  <text x="600" y="470" class="s">Gi0/0 · VLAN1 access</text>
  <rect x="600" y="520" width="170" height="76" rx="6" class="pi"/>
  <text x="685" y="543" class="h" text-anchor="middle">Raspberry Pi 3B+</text>
  <text x="685" y="561" class="s" text-anchor="middle">10.10.10.53/25 (static)</text>
  <text x="685" y="578" class="m" text-anchor="middle">Raspbian 9 · SSH, VNC</text>

  <!-- CBS250 on Gi0/1 trunk -->
  <line x1="900" y1="430" x2="890" y2="520" class="trunk"/>
  <text x="884" y="462" class="s" fill="#0e7490" text-anchor="end">Gi0/1 ⇄ GE1</text>
  <text x="884" y="477" class="m" text-anchor="end">802.1Q trunk</text>
  <text x="884" y="491" class="m" text-anchor="end">1 untagged · 10 tagged</text>
  <rect x="800" y="520" width="180" height="76" rx="6" class="cisco"/>
  <text x="890" y="543" class="h" text-anchor="middle">Cisco CBS250-8T-D</text>
  <text x="890" y="561" class="s" text-anchor="middle">mgmt 10.10.10.3 (DHCP)</text>
  <text x="890" y="578" class="m" text-anchor="middle">VLAN 1, VLAN 10 "ZADARA"</text>

  <!-- Zadara on GE2 trunk -->
  <line x1="890" y1="596" x2="890" y2="650" class="trunk"/>
  <text x="882" y="628" class="s" fill="#0e7490" text-anchor="end">GE2 access (VLAN 10 untagged)</text>
  <rect x="660" y="650" width="320" height="120" rx="6" class="srv"/>
  <text x="820" y="673" class="h" text-anchor="middle">Zadara · Ubuntu 24.04 · DevStack 2026.2</text>
  <text x="674" y="695" class="s">enp2s0     10.10.11.6/24 (VLAN10, static) = HOST_IP</text>
  <text x="674" y="713" class="s">           default route → 10.10.11.1</text>
  <text x="674" y="731" class="s">br-ex      172.24.4.1/24 (floating IPs, host-only)</text>
  <text x="674" y="753" class="m">Horizon: http://10.10.11.6/dashboard</text>

  <!-- Legend + notes -->
  <text x="40" y="470" class="h">Legend</text>
  <line x1="40" y1="492" x2="90" y2="492" class="phy"/>
  <text x="100" y="496" class="s">Ethernet (access / untagged)</text>
  <line x1="40" y1="514" x2="90" y2="514" class="trunk"/>
  <text x="100" y="518" class="s">802.1Q trunk</text>
  <line x1="40" y1="536" x2="90" y2="536" class="log"/>
  <text x="100" y="540" class="s">Logical link (BGP / IPsec)</text>
  <line x1="40" y1="558" x2="90" y2="558" class="down"/>
  <text x="100" y="562" class="s">Tunnel that is down</text>

  <text x="40" y="610" class="h">Notes</text>
  <text x="40" y="632" class="s">• 10.10.11.0/24 is not reachable from the home LAN until the home</text>
  <text x="52" y="648" class="s">router has: 10.10.11.0/24 → 192.168.0.100</text>
  <text x="40" y="670" class="s">• Kobe's DHCP pool hands out /25 masks; Vlan1 itself is /24</text>
  <text x="40" y="692" class="s">• Pi 3B+ (10.10.10.53) is static inside the DHCP range</text>
  <text x="40" y="714" class="s">• Kobe has no NAT: the home router routes 10.10.10.0 back</text>
</svg>
