<text x="26" y="48" font-size="22" font-weight="700" fill="#0f172a">Notes</text>
<text x="26" y="82" font-size="20" fill="#334155">Estimated cost: ~$1-3/month (Route 53 zone + small redirect distribution); Lambda/API Gateway usage stays within/near free tier for personal traffic.</text>
<text x="26" y="112" font-size="20" fill="#334155">Secrets (Turnstile secret, admin_api_key, Voyage/Anthropic API keys) live only in terraform.tfvars (gitignored) and Lambda env vars — never committed.</text>
<text x="26" y="142" font-size="20" fill="#334155">Out of scope: no user login/accounts, no likes/reactions. Comments are anonymous + name field, moderated via x-api-key admin routes.</text>
<text x="26" y="172" font-size="20" fill="#334155">Region: ap-northeast-1 for all resources except ACM certificates, which must be requested in us-east-1 for CloudFront.</text>
