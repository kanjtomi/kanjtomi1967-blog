baseURL = "https://www.kanjtomi1967.net/"
languageCode = "ja"
title = "Kanji's Tech Notes"
theme = "PaperMod"
hasCJKLanguage = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Kanji's Tech Notes"
  description = "AWS / AI / インフラ技術メモ"
  keywords = ["AWS", "Hugo", "Jenkins", "AI", "Infra"]
  author = "Kanji"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = true
  turnstileSiteKey = "0x4AAAAAAEG_N4t-dvN2MMCh"
  commentsApiBase = "https://0fr1eq5b4j.execute-api.ap-northeast-1.amazonaws.com"
  ragApiBase = "https://xaq4ljfx63.execute-api.ap-northeast-1.amazonaws.com"

  [params.homeInfoParams]
    Title = "こんにちは 👋"
    Content = "AWS / AI-native インフラ / エンタープライズサポートに関する技術メモを書いています。"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.3
    minMatchCharLength = 2
    limit = 10
    keys = ["title", "tags", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "記事一覧"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "検索"
    url = "/search/"
    weight = 30

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
