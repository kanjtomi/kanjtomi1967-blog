# Second interface (net1) for the FRR pod: macvlan on the host's LAN NIC with a
# fixed address, so FRR sits on 192.168.0.0/24 as its own router next to the
# Cisco. No NAT (which would break eBGP TTL/next-hop handling) and no firewalld
# change. With macvlan the host itself cannot reach 192.168.0.210.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: bgp-lan
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp3s0",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [ { "address": "192.168.0.210/24" } ]
      }
    }
