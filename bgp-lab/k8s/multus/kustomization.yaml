# Multus CNI (thick plugin), so a pod can get a second interface (macvlan on the LAN).
#   kubectl apply -k bgp-lab/k8s/multus
# The release manifest points at the floating "snapshot-thick" image; pin it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.1/deployments/multus-daemonset-thick.yml
images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.1-thick
