# Multus CNI (thick plugin), so a pod can get a second interface (macvlan on the LAN).
#   kubectl apply -k bgp-lab/k8s/multus
# The release manifest points at the floating "snapshot-thick" image; pin it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.1/deployments/multus-daemonset-thick.yml
images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.1-thick
# Upstream sets memory 50Mi (request = limit). On this node the daemon sat at that limit
# and the kernel kept evicting and re-reading its file pages from /glide (USB SSD):
# ~40 MB/s of reads nonstop, 16.5 TB in 4.7 days, which starved every other pod's I/O
# (2026-11-07). Give it headroom.
patches:
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
