! FRR side of the BGP lab (AS 65002), peering with the Cisco C841M "Kobe" (AS 65001).
frr defaults traditional
hostname frr-bgp
log stdout informational
service integrated-vtysh-config
!
! Test network advertised to the Cisco. Lives only inside the container's netns.
interface lo
 ip address 172.16.2.1/24
exit
!
! FRR refuses to exchange eBGP routes without an explicit policy (RFC 8212),
! so every neighbor gets an in/out route-map. Lesson 3 (filtering) edits these.
route-map FROM-CISCO permit 10
exit
route-map TO-CISCO permit 10
exit
!
router bgp 65002
 bgp router-id 192.168.0.210
 bgp log-neighbor-changes
 neighbor 192.168.0.100 remote-as 65001
 neighbor 192.168.0.100 description cisco-kobe
 !
 address-family ipv4 unicast
  network 172.16.2.0/24
  neighbor 192.168.0.100 route-map FROM-CISCO in
  neighbor 192.168.0.100 route-map TO-CISCO out
 exit-address-family
exit
!
line vty
exit
