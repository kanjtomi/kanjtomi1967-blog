# わざと控えめな初期値。04-network.sh の練習で変える候補に印を付けてある。
worker_processes 1;              # 練習: auto や 2 にして、limits.cpu との関係を見る
events {
    worker_connections 512;      # 練習: 同時接続を増やすと足りなくなる
}
http {
    access_log off;              # ディスク (USB SSD) に負荷をかけないため
    keepalive_timeout 65;        # 練習: 0 にすると毎回接続し直しになる
    keepalive_requests 1000;
    server {
        listen 80;               # 練習: backlog=... (listen キュー。somaxconn が上限)
        location / {
            default_type text/plain;
            return 200 "ok\n";
        }
        location /stub_status {
            stub_status;
        }
    }
}
